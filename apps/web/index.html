<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!--app-csp-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#2F45D8" />
    <meta name="description" content="AngebotPilot – Angebote erstellen, nachfassen und in Aufträge umwandeln." />
    <!-- Applies the stored theme and language before the first paint (no light flash in dark mode). Mirrors src/lib/theme.ts and src/lib/i18n.tsx; the CSP allows it by hash. -->
    <script>
      (function () {
        var root = document.documentElement;
        try {
          var pref = localStorage.getItem('ap.theme');
          var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          root.setAttribute('data-theme', dark ? 'dark' : 'light');
          root.style.colorScheme = dark ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#171B23' : '#2F45D8');
          var lang = localStorage.getItem('ap.locale');
          if (lang === 'de' || lang === 'en') root.lang = lang;
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>AngebotPilot</title>
  </head>
  <body>
    <noscript>Bitte aktivieren Sie JavaScript, um AngebotPilot zu nutzen. / Please enable JavaScript to use AngebotPilot.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
